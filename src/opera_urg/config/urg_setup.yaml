# 検出起動では使わない。URG の位置は urg_position.yaml を使う。
urg_11:
  x: 0.0
  y: 5.0
  yaw: 0.0

# 世界座標で残す範囲。境界は含まない。単位はメートル。
scan_range:
  min_x: -1.5
  max_x: 6.5
  min_y: 0.0
  max_y: 5.0

# 検出する直線の長さ。単位はメートル。
# length_tolerance は許容幅。length ± length_tolerance の線分だけを採用する。
line:
  length: 1.50
  length_tolerance: 0.10
  # 再検出で残す点の、推定直線への垂直距離の上限。単位はメートル。これ以上離れた点は除く。
  refine_distance: 0.020
  # 世界の +X を 0° とし、左右に何度までを直線として認めるか。単位は度。
  max_angle_from_plus_x_deg: 45.0
  # 隣接点の間隔がこれを超えたら別の点群に分ける。単位はメートル。
  max_gap: 0.15

# /line_center の出力フィルタ。
# max_center_jump: メートル。これを超える位置の変化は捨てる。
# max_yaw_jump_deg: 度。これを超える向きの変化は捨てる。
# jump_reset_count: 連続で捨てた回数。達すると基準をリセットする。
# smooth_new_ratio: 今回の検出を混ぜる割合。残りは前回の出力。
line_filter:
  max_center_jump: 0.3
  max_yaw_jump_deg: 15.0
  jump_reset_count: 10
  smooth_new_ratio: 1.0
